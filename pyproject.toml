[project]
name = "momobase"
version = "0.1.0"
description = "Python SDK for the Momobase payment service API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/momobasehq/sdk-python"
Documentation = "https://momobasehq.github.io/sdk/"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
